                history: "瑞典俚語 På en räkmacka 意指「坐在蝦三明治上」，形容人生順遂、不費吹灰之力。", 
                humor: "這趟去瑞典的唯一目的：讓自己像坐在蝦三明治上一樣順遂！", 
                spots: ["菲特利克岩畫", "瑞典公賣局", "Nordby 購物中心"] 
            },
            17: { 
                title: "告別北境：奧斯陸起飛", weather: "15°C", icon: "fa-plane-departure", outfit: "機上舒適服裝", 
                hotel: "Flight to BKK", hotelAmenity: "✈️ 萬里長空", target: "Oslo Airport", dist: "50 km", time: "11 hrs", 
                desc: "早上在青旅享受最後的挪威早餐。10:00 Check Out，準備前往機場搭乘 13:45 的航班離開這片峽灣與森林，飛往曼谷轉機。這趟 18 天的史詩冒險，正式進入尾聲。", 
                history: "我們把挪威的純淨空氣與峽灣記憶，打包進了這 18 天的行囊中。", 
                humor: "現在只剩下一個挑戰：如何把滿滿的行李箱拉上飛機。", 
                spots: ["青旅早餐", "奧斯陸機場", "機上窗景"] 
            },
            18: { 
                title: "平安賦歸：曼谷半日遊", weather: "32°C", icon: "fa-home", outfit: "夏季輕裝", 
                hotel: "Sweet Home", hotelAmenity: "🇹🇼 台灣溫暖的家", target: "TPE Airport", dist: "BKK-TPE", time: "Flight", 
                desc: "清晨 06:15 抵達曼谷。08:00 入境泰國，搭乘 BTS 到 Saphan Khwai 站 (3號出口) 享受半天的熱帶風情。14:00 回機場準備 17:15 飛往台北，預計 11:50 平安回到溫暖的家！", 
                history: "從北緯 60 度的冰川回到亞熱帶的台灣，這是一場跨越半個地球的壯遊。", 
                humor: "這趟旅程最神奇的地方在於，你昨天還在穿羊毛衣，今天就在流汗吃泰式炒河粉。", 
                spots: ["入境曼谷", "Saphan Khwai", "溫暖的家"] 
            }
        };

        function renderDay(d) {
            const data = itineraryData[d];
            const content = document.getElementById('dayContent');
            const navSpotUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(data.target + ", Norway");
            const navHotelUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(data.hotel + ", Norway");

            const spotsList = data.spots.map((s, i) => {
                const searchStr = encodeURIComponent(s + " " + data.target + ", Norway");
                return `<a href="https://www.google.com/maps/search/?api=1&query=${searchStr}" target="_blank" class="spot-item"><div class="spot-num">${i + 1}</div><span>${s}</span></a>`;
            }).join('');

            content.innerHTML = `
                <div class="animate-fadeInUp">
                    <div class="hero-info shadow p-4">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="badge bg-white text-dark">DAY ${d}</span>
                            <span class="small opacity-75"><i class="fas fa-calendar-day me-1"></i> JULY 2026</span>
                        </div>
                        <div class="row align-items-end">
                            <div class="col-7">
                                <h3 class="fw-bold mb-1" style="font-size: 1.25rem;">${data.title}</h3>
                                <div class="d-flex mt-2"><span class="meta-badge">${data.dist}</span><span class="meta-badge">${data.time}</span></div>
                            </div>
                            <div class="col-5">
                                <div class="spotlight-box"><div class="fw-bold mb-2" style="font-size:0.6rem; color:#E8B4B8;">TOP SPOTS</div>${spotsList}</div>
                            </div>
                        </div>
                    </div>

                    <div class="gear-card">
                        <div class="gear-weather"><i class="fas ${data.icon} mb-1" style="color: #E8B4B8;"></i><div class="fw-bold">${data.weather}</div></div>
                        <div class="gear-outfit"><strong>重點提醒：</strong>${data.outfit}</div>
                    </div>
                    
                    <div class="glass-card mb-3 p-3" style="background: rgba(255,255,255,0.7); border-radius: 20px;">
                        <p class="small text-muted mb-2" style="line-height: 1.5;">${data.desc}</p>
                        <div class="hotel-info">
                            <i class="fas fa-bed text-primary"></i> <strong>宿：</strong> ${data.hotel} 
                        </div>
                        <div class="small text-secondary mt-1" style="font-size: 0.65rem;">設施：${data.hotelAmenity}</div>
                        
                        <div class="nav-group">
                            <a href="${navSpotUrl}" target="_blank" class="nav-trigger"><i class="fas fa-location-arrow"></i>前往景點</a>
                            <a href="${navHotelUrl}" target="_blank" class="nav-trigger hotel"><i class="fas fa-hotel"></i>前往飯店</a>
                        </div>
                    </div>
                    
                    <div class="info-fold">
                        <div class="fold-header"><span>知性歷史 / 挪威幽默</span><i class="fas fa-chevron-down"></i></div>
                        <div class="mt-2 small text-secondary border-top pt-2">
                            <strong>歷史：</strong>${data.history}<br>
                            <span class="fst-italic mt-1 d-block" style="color:#E8B4B8;">"${data.humor}"</span>
                        </div>
                    </div>
                </div>`;
            localStorage.setItem('norway_last_day', d);
        }

        const picker = document.getElementById('dayPicker');
        for (let i = 1; i <= 18; i++) {
            const btn = document.createElement('div');
            btn.className = `day-btn day-id-${i}`;
            btn.innerText = i;
            btn.onclick = function() {
                document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active'); renderDay(i);
                this.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            };
            picker.appendChild(btn);
        }

        const savedDay = parseInt(localStorage.getItem('norway_last_day')) || 1;
        renderDay(savedDay);
        document.querySelector(`.day-id-${savedDay}`).classList.add('active');
        setTimeout(() => { document.querySelector(`.day-id-${savedDay}`).scrollIntoView({ behavior: 'smooth', inline: 'center' }); }, 300);
    </script>
    <nav class="bottom-nav">
        <!-- 注意看這裡，active 在「總覽」 -->
        <a href="index.html" class="active"><i class="fas fa-house-chimney"></i><span>總覽</span></a>
        <a href="culture.html"><i class="fas fa-compass"></i><span>行程</span></a>
        <a href="guide.html"><i class="fas fa-feather-pointed"></i><span>指南</span></a>
        <a href="language.html"><i class="fas fa-language"></i><span>會話</span></a>
    </nav>
</body>
