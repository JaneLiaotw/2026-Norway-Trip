<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Norway Trip</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-snow-white text-gray-800">
    <nav class="p-4 bg-ice-blue flex justify-between">
        <a href="#" class="text-xl">總覽</a>
        <a href="#" class="text-xl">行程</a>
        <a href="#" class="text-xl">指南</a>
    </nav>
    <div class="flex mt-4">
        <div class="w-1/2 p-4">
            <h2 class="text-2xl font-semibold mb-4">Choose Location</h2>
            <ul>
                <li onclick="selectLocation('Oslo')" class="cursor-pointer hover:bg-gray-200 p-2">Oslo</li>
                <li onclick="selectLocation('Kristiansand')" class="cursor-pointer hover:bg-gray-200 p-2">Kristiansand</li>
                <li onclick="selectLocation('Bergen')" class="cursor-pointer hover:bg-gray-200 p-2">Bergen</li>
            </ul>
            <div id="word-card" class="mt-4 p-4 border rounded-lg"></div>
        </div>
        <div class="w-1/2 p-4">
            <h2 class="text-2xl font-semibold mb-4">Map</h2>
            <svg id="norway-map" class="w-full h-64" viewBox="0 0 100 100">
              <!-- Add SVG data for Norway map here -->
            </svg>
        </div>
    </div>
    <script>
        function selectLocation(location) {
            // Update the word card content based on location
            const wordCard = document.getElementById('word-card');
            let content;
            if (location === 'Oslo') {
                content = '<h3 class="text-xl">Oslo</h3><p>Learn the word: "Hei" (Hello)</p>';
            } else if (location === 'Kristiansand') {
                content = '<h3 class="text-xl">Kristiansand</h3><p>Learn the word: "Takk" (Thank you)</p>';
            } else if (location === 'Bergen') {
                content = '<h3 class="text-xl">Bergen</h3><p>Learn the word: "Ja" (Yes)</p>';
            }
            wordCard.innerHTML = content;

            // Pulsing effect on the map marker
            // Implement pulse effect for corresponding location on the SVG map
        }
    </script>
</body>
</html>
