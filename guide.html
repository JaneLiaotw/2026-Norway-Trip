<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Guide | Norway 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .guide-scroller { display: flex; overflow-x: auto; gap: 10px; padding: 15px 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .guide-scroller::-webkit-scrollbar { display: none; }
        .cat-tag { min-width: 105px; padding: 10px 18px; border-radius: 50px; background: white; border: 1.5px solid var(--nordic-pink); color: var(--nordic-pink); font-size: 0.8rem; font-weight: 700; text-align: center; cursor: pointer; white-space: nowrap; transition: 0.3s; text-decoration: none; }
        .cat-tag.active { background: var(--nordic-pink); color: white; box-shadow: 0 4px 15px rgba(232, 180, 184, 0.3); }
        .tactical-card { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; margin-bottom: 15px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .importance-strip { width: 6px; border-radius: 10px; margin-right: 15px; flex-shrink: 0; }
        .imp-high { background: #FF6B6B; } .imp-med { background: #FFD93D; } .imp-low { background: #6BCB77; }
        .pro-tip-box { background: rgba(0,0,0,0.04); border-radius: 12px; padding: 12px; font-size: 0.85rem; border-left: 3px solid #434C5E; margin-bottom: 8px; }
        .humor-quote { font-size: 0.82rem; color: #8a6d6d; font-style: italic; display: block; }
    </style>
</head>
<body class="p-3 bg-warm">

    <header class="mb-4 mt-2 px-2">
        <h2 class="fw-bold">Tactical Guide</h2>
        <p class="text-muted small">這不是指南，這是你在挪威優雅生存的戰術地圖。</p>
    </header>

    <div class="guide-scroller mb-4" id="catNav">
        <div class="cat-tag active" onclick="switchGuide('driving')">🚗 道路戰術</div>
        <div class="cat-tag" onclick="switchGuide('apps')">📱 必備工具</div>
        <a href="language.html" class="cat-tag">🇳🇴 語言百科</a> <div class="cat-tag" onclick="switchGuide('grocery')">🛒 超市生存</div>
        <div class="cat-tag" onclick="switchGuide('weather')">🌦️ 天候應對</div>
        <div class="cat-tag" onclick="switchGuide('emergency')">🆘 緊急救援</div>
    </div>

    <div id="guideDisplay"></div>

    <div style="height: 100px;"></div>

    <nav class="footer-nav">
        <a href="index.html"><i class="fas fa-house-chimney"></i><span>總覽</span></a>
        <a href="culture.html"><i class="fas fa-compass"></i><span>行程</span></a>
        <a href="guide.html" class="active"><i class="fas fa-feather-pointed"></i><span>指南</span></a>
    </nav>

    <script>
        const fullGuideData = {
            driving: [
                { title: "M-Plass：山路禮讓", imp: "high", desc: "看到藍底白字『M』是避車彎。若你這側有 M 且對向有大車，請停下。", tip: "對方閃燈是說 Takk (謝謝)。請舉手回禮。", humor: "停在 M 拍照會讓後方大客車司機用眼神把你送回家。" },
                { title: "AutoPass 收費", imp: "med", desc: "全挪威公路與渡輪皆自動感應車牌。", tip: "不需找零錢，直接開過去即可。", humor: "還車後，租車公司會直接從信用卡扣除，不用擔心。" }
            ],
            apps: [
                { title: "Yr.no 氣象", imp: "high", desc: "挪威氣象局官方數據，極度精準。", tip: "登山前必看每小時的風速與降雨預報。", humor: "在挪威，Yr 的話就是真理。" },
                { title: "EasyPark 停車", imp: "high", desc: "全挪威最通用的停車 App。", tip: "在台灣先綁好信用卡並完成手機號碼註冊。", humor: "粉紅圓圈圖示，看到它就是救星。" }
            ],
            grocery: [
                { title: "週日超市公休", imp: "high", desc: "絕大多數超市週日不營業，務必提前囤貨。", tip: "週六下午 6 點後連啤酒都會禁賣，請提早。", humor: "週日餓肚子是自找的，這叫北歐式震撼教育。" }
            ],
            weather: [
                { title: "洋蔥式穿衣", imp: "high", desc: "內層排汗、中層保暖、外層防風防水。", tip: "夏天也會有 5 度的山區，薄羽絨必備。", humor: "沒有壞天氣，只有穿錯衣服的觀光客。" }
            ],
            emergency: [
                { title: "救援：112 / 113", imp: "high", desc: "112 警察、113 醫療急救。", tip: "手機安裝 Hjelp 113 App 自動同步座標。", humor: "祝這張卡片直到你回國前都是裝飾品。" }
            ]
        };

        function switchGuide(category) {
            document.querySelectorAll('.cat-tag').forEach(tag => {
                tag.classList.remove('active');
                if(tag.getAttribute('onclick') && tag.getAttribute('onclick').includes(category)) tag.classList.add('active');
            });
            renderList(category);
        }

        function renderList(category) {
            const sectionData = fullGuideData[category];
            const html = sectionData.map((item, index) => `
                <div class="glass-card tactical-card d-flex p-3" style="animation-delay: ${index * 0.1}s">
                    <div class="importance-strip imp-${item.imp}"></div>
                    <div class="flex-grow-1">
                        <h5 class="fw-bold mb-1">${item.title}</h5>
                        <p class="small text-muted mb-2">${item.desc}</p>
                        <div class="pro-tip-box">
                            <i class="fas fa-lightbulb text-info me-2"></i><strong>戰術：</strong> ${item.tip}
                        </div>
                        <span class="humor-quote">"${item.humor}"</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('guideDisplay').innerHTML = html;
        }

        switchGuide('driving');
    </script>
</body>
</html>
