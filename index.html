<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Norway 2026 | Strategy Center</title>
<!-- 引入 App 身分證 -->
    <link rel="manifest" href="/2026-Norway-Trip/manifest.json">
    
    <!-- 呼叫 Service Worker 管家 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/2026-Norway-Trip/sw.js')
            .then(registration => {
              console.log('離線管家已經就緒！範圍:', registration.scope);
            })
            .catch(error => {
              console.log('離線管家安裝失敗:', error);
            });
        });
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .stagger-in { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .progress-container { position: relative; width: 75px; height: 75px; }
        .progress-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .progress-circle-back { fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 3.5; }
        .progress-circle-front { fill: none; stroke: white; stroke-width: 3.5; stroke-dasharray: 100; stroke-dashoffset: 100; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .charge-section-optimized { background: linear-gradient(135deg, rgba(168, 218, 220, 0.5) 0%, rgba(238, 214, 211, 0.5) 100%); }
        .map-btn-soft { background: white; border-radius: 12px; padding: 10px; text-decoration: none; color: #434C5E; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; border: none; }
    </style>
</head>
<body class="p-3 bg-warm">
    <header class="mb-4 mt-3 px-2 stagger-in" style="animation-delay: 0.1s">
        <div class="d-flex justify-content-between align-items-center">
            <div><h2 class="fw-bold mb-0">Strategy Center</h2><p class="text-muted small mb-0">Norway Roadtrip 2026</p></div>
            <div class="progress-container">
                <svg class="progress-svg" viewBox="0 0 36 36">
                    <path class="progress-circle-back" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="progressCircle" class="progress-circle-front" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div id="progressText" style="position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size: 0.75rem; font-weight: 800; color: #434C5E;">0%</div>
            </div>
        </div>
    </header>

    <div class="glass-card stagger-in mb-3" style="animation-delay: 0.2s">
        <h6 class="fw-bold mb-3"><i class="fas fa-coins text-warning me-2"></i>匯率計算 (1:3.05)</h6>
        <div class="row g-2 align-items-center">
            <div class="col-5"><input type="number" id="nok" class="form-control border-0 bg-light fw-bold" placeholder="NOK" oninput="convert(this.value, 'nok')"></div>
            <div class="col-2 text-center"><i class="fas fa-exchange-alt text-muted"></i></div>
            <div class="col-5"><input type="number" id="twd" class="form-control border-0 bg-light fw-bold" placeholder="TWD" oninput="convert(this.value, 'twd')"></div>
        </div>
    </div>

    <div class="glass-card charge-section-optimized stagger-in mb-3" style="animation-delay: 0.3s">
        <h6 class="fw-bold mb-3"><i class="fas fa-satellite-dish me-2"></i>補給戰術雷達</h6>
        <div class="d-flex gap-2">
            <a href="https://www.google.com/maps/search/?api=1&query=Supermarket" target="_blank" class="map-btn-soft flex-fill">
                <i class="fas fa-shopping-cart text-success me-2"></i>找超市
            </a>
            <a href="https://www.google.com/maps/search/?api=1&query=EV+Charging+Station" target="_blank" class="map-btn-soft flex-fill">
                <i class="fas fa-bolt text-warning me-2"></i>找充電
            </a>
        </div>
    </div>

    <div class="glass-card stagger-in shadow" style="background: #E8B4B8; color: white; animation-delay: 0.4s; border: none;">
        <h6 class="fw-bold x-small opacity-75 mb-1">NEXT TARGET</h6>
        <div class="h4 fw-bold mb-3" id="targetName">Loading...</div>
        <a id="navLink" href="#" target="_blank" class="map-btn-soft w-100 shadow-sm" style="color: #E8B4B8;">
            <i class="fas fa-location-arrow me-2"></i>開始導覽
        </a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="active"><i class="fas fa-house-chimney"></i><span>總覽</span></a>
        <a href="culture.html"><i class="fas fa-compass"></i><span>行程</span></a>
        <a href="guide.html"><i class="fas fa-feather-pointed"></i><span>指南</span></a>
        <a href="language.html"><i class="fas fa-language"></i><span>會話</span></a>
    </nav>

    <script>
        function convert(val, type) {
            const rate = 3.05;
            if(type === 'nok') document.getElementById('twd').value = val ? Math.round(val * rate) : '';
            else document.getElementById('nok').value = val ? (val / rate).toFixed(1) : '';
        }

        window.onload = function() {
            const savedDay = parseInt(localStorage.getItem('norway_last_day')) || 1;
            const progress = Math.round((savedDay / 18) * 100);
            
            setTimeout(() => {
                document.getElementById('progressCircle').style.strokeDashoffset = 100 - progress;
                document.getElementById('progressText').innerText = progress + "%";
            }, 500);

            const itinerary = { 
               1: "Suvarnabhumi Airport",           // Day 1: 曼谷轉機
                2: "Kristiansand",                   // Day 2: 南下
                3: "Stavanger",                      // Day 3: 最南端與石中劍
                4: "Preikestolen Basecamp",          // Day 4: 聖壇岩
                5: "Haraldshaugen, Haugesund",       // Day 5: 斯庫德內斯港與豪格松
                6: "Bryggen, Bergen",                // Day 6: 卑爾根
                7: "Stegastein",                     // Day 7: 艾於蘭與弗萊姆
                8: "Stryn",                          // Day 8: 書鎮與冰川
                9: "Geiranger",                      // Day 9: 蓋朗厄爾老鷹之路
                10: "Geiranger Fjord",               // Day 10: 峽灣釣魚
                11: "Ålesund",                       // Day 11: 奧勒松新藝術街區
                12: "Trollstigen",                   // Day 12: 巨魔之路
                13: "Sohlbergplassen",               // Day 13: 苔原與觀景台
                14: "Oslo Youth Hostel Haraldsheim", // Day 14: 利勒哈默爾與奧斯陸
                15: "Opera House, Oslo",             // Day 15: 奧斯陸市區藝術
                16: "Nordby Shoppingcenter, Sweden", // Day 16: 快閃瑞典
                17: "Oslo Airport",                  // Day 17: 奧斯陸起飛
                18: "Saphan Khwai BTS"               // Day 18: 曼谷快閃與賦歸
            };

            const target = itinerary[savedDay] || "Oslo";
            document.getElementById('targetName').innerText = "Day " + savedDay + ": " + target.split(',')[0];
            const searchPlace = (savedDay === 1 || savedDay === 16 || savedDay === 18) ? target : target + ", Norway";
            document.getElementById('navLink').href = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(searchPlace);
        };
    </script>
</body>
</html>
