        function renderVocab(filter = "") {
            const container = document.getElementById('languageContent');
            container.innerHTML = "";
            let currentCat = "";

            const filtered = vocabulary.filter(v => 
                v.n.toLowerCase().includes(filter.toLowerCase()) || 
                v.m.includes(filter) ||
                v.cat.includes(filter)
            );

            filtered.forEach(v => {
                if (v.cat !== currentCat) {
                    currentCat = v.cat;
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerHTML = `<span>${currentCat}</span><i class="fas fa-chevron-down"></i>`;
                    container.appendChild(header);
                }

                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.innerHTML = `
                    <div class="d-flex justify-content-between">
                        <span class="norsk">${v.n}</span>
                        <span class="pronounce">${v.p}</span>
                    </div>
                    <div class="meaning">${v.m}</div>
                    <div class="desc">${v.d}</div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('phraseSearch').addEventListener('input', (e) => {
            renderVocab(e.target.value);
        });

        renderVocab();
