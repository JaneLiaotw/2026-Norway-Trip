    <style>
        .category-nav {
            display: flex; overflow-x: auto; gap: 10px; padding: 10px 0;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
            position: sticky; top: 60px; z-index: 999; background: #FDF6F0;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: white; border: 1.5px solid var(--nordic-pink);
            color: var(--nordic-pink); border-radius: 50px; padding: 6px 15px;
            font-size: 0.85rem; font-weight: 700; white-space: nowrap; cursor: pointer;
        }
        .cat-btn.active { background: var(--nordic-pink); color: white; }
        
        .lang-card {
            background: white; border-radius: 18px; margin-bottom: 12px;
            border-left: 6px solid #5E81AC; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden;
        }
        .lang-card:active { transform: scale(0.97); }
        .play-btn-box { background: #E5E9F0; width: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .play-btn-box i { color: #5E81AC; font-size: 1.4rem; }
        .norsk-word { font-size: 1.2rem; font-weight: 800; color: #2E3440; }
        .pronounce-tag { font-size: 0.75rem; color: #888; background: #ECEFF4; padding: 1px 6px; border-radius: 4px; }
        .search-box { position: sticky; top: 0; z-index: 1000; background: #FDF6F0; padding: 10px 0; }
    </style>

        let currentFilter = "全部";

        function playSound(text) {
            const msg = new URLSearchParams({ ie: 'UTF-8', q: text, tl: 'no', client: 'tw-ob' });
            const audio = new Audio(`https://translate.google.com/translate_tts?${msg.toString()}`);
            audio.play().catch(() => alert("語音加載中，請再試一次！"));
        }

        function filterCat(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.includes(cat));
            });
            render();
        }

        function render(filterText = "") {
            const list = document.getElementById('langList');
            list.innerHTML = "";
            const filtered = vocabulary.filter(item => {
                const matchCat = (currentFilter === "全部" || item.c === currentFilter);
                const matchSearch = item.n.toLowerCase().includes(filterText.toLowerCase()) || item.m.includes(filterText);
                return matchCat && matchSearch;
            });
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "lang-card d-flex";
                card.innerHTML = `
                    <div class="flex-grow-1 p-3">
                        <div class="norsk-word">${item.n} <span class="pronounce-tag ms-2">${item.p}</span></div>
                        <div class="fw-bold text-primary small">${item.m}</div>
                        <div class="text-muted" style="font-size:0.7rem">${item.d}</div>
                    </div>
                    <div class="play-btn-box" onclick="playSound('${item.n}')">
                        <i class="fas fa-volume-up"></i>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('langSearch').addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
