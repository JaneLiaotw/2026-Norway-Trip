        let currentCat = "全部";

        function playSound(text) {
            // 處理多個單字的情況，只取第一個發音
            const targetText = text.split('/')[0].trim();
            // Google TTS 連結 (使用 tl=no 代表挪威語)
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(targetText)}&tl=no&client=tw-ob`;
            const audio = new Audio(url);
            audio.play().catch(e => {
                console.error("發音播放失敗:", e);
                alert("點擊頻率過快或網路不穩，請稍後再試！");
            });
        }

        function filterCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.includes(cat)));
            render();
        }

        function render(search = "") {
            const list = document.getElementById('langList');
            list.innerHTML = "";
            const filtered = vocabulary.filter(item => {
                const matchSearch = item.n.toLowerCase().includes(search.toLowerCase()) || item.m.includes(search);
                const matchCat = currentCat === "全部" || item.c === currentCat;
                return matchSearch && matchCat;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "lang-card";
                card.innerHTML = `
                    <div class="flex-grow-1 p-3">
                        <div class="norsk-word">${item.n} <span class="pronounce-tag ms-2">${item.p}</span></div>
                        <div class="fw-bold text-primary small">${item.m}</div>
                        <div class="text-muted" style="font-size:0.75rem">${item.d}</div>
                    </div>
                    <div class="play-btn-box" onclick="playSound('${item.n}')">
                        <i class="fas fa-volume-up"></i>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('langSearch').addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
