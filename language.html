        let currentCat = "全部";
        let norwegianVoice = null;

        function initVoice() {
            const voices = window.speechSynthesis.getVoices();
            norwegianVoice = voices.find(v => v.lang === 'nb-NO' || v.lang === 'no-NO');
        }

        window.speechSynthesis.onvoiceschanged = initVoice;

        function playSound(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text.split('/')[0]);
            utterance.lang = 'nb-NO';
            if (norwegianVoice) utterance.voice = norwegianVoice;
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function filterCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat));
            });
            render();
        }

        function render(search = "") {
            const list = document.getElementById('langList');
            list.innerHTML = "";
            const filtered = vocabulary.filter(item => {
                const matchSearch = item.n.toLowerCase().includes(search.toLowerCase()) || item.m.includes(search);
                const matchCat = currentCat === "全部" || item.c === currentCat;
                return matchSearch && matchCat;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "lang-card";
                card.innerHTML = `
                    <div class="flex-grow-1 p-3">
                        <div class="norsk-word">${item.n} <span class="pronounce-tag ms-1">${item.p}</span></div>
                        <div class="fw-bold text-primary small">${item.m}</div>
                        <div class="text-muted" style="font-size:0.7rem">${item.d}</div>
                    </div>
                    <button class="play-btn-box" onclick="playSound('${item.n}')">
                        <i class="fas fa-volume-up"></i>
                    </button>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('langSearch').addEventListener('input', (e) => render(e.target.value));
        initVoice();
        render();
    </script>
