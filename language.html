    <style>
        .search-box { position: sticky; top: 0; z-index: 100; background: #FDF6F0; padding: 15px 0; }

        .play-btn { color: var(--nordic-pink); cursor: pointer; font-size: 1.5rem; transition: 0.2s; padding: 10px; }
        .play-btn:active { transform: scale(1.3); }
        .norsk-text { font-size: 1.2rem; font-weight: 800; color: #2E3440; }
        .p-text { font-size: 0.85rem; color: #888; background: #ECEFF4; padding: 2px 8px; border-radius: 6px; }
        .cat-label { font-size: 0.85rem; font-weight: 700; color: white; background: var(--nordic-pink); padding: 3px 12px; border-radius: 50px; margin-bottom: 8px; display: inline-block; }

        function playSound(txt) {
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(txt)}&tl=no&client=tw-ob`;
            new Audio(url).play().catch(() => window.open(url, '_blank'));
        }

        function render(f = "") {
            const list = document.getElementById('langContent');
            list.innerHTML = "";
            v.filter(i => i.n.toLowerCase().includes(f.toLowerCase()) || i.m.includes(f) || i.c.includes(f)).forEach(i => {
                const card = document.createElement('div');
                card.className = "lang-card p-3 d-flex justify-content-between align-items-center";
                card.innerHTML = `<div><div class="cat-label">${i.c}</div><div class="norsk-text">${i.n} <span class="p-text ms-2">${i.p}</span></div><div class="fw-bold my-1">${i.m}</div><div class="small text-muted">${i.d}</div></div><i class="fas fa-volume-up play-btn" onclick="playSound('${i.n}')"></i>`;
                list.appendChild(card);
            });
        }

        document.getElementById('langSearch').addEventListener('input', (e) => render(e.target.value));
        render();

</body>
</html>
